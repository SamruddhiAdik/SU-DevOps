apiVersion: apps/v1
apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-academic-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: student-academic-platform
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: student-academic-platform
    spec:
      containers:
        - name: student-academic-platform
          image: student-academic-platform:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
